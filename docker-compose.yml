version: "3.9"

services:
  server:
    build: ./server
    container_name: bookmyvenue-server

    ports:
      - "8000:8000"

    volumes:
      - ./server:/app
      - /app/node_modules

    env_file:
      - ./server/.env

  client:
    build: ./client
    container_name: bookmyvenue-client

    ports:
      - "5173:5173"

    volumes:
      - ./client:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    depends_on:
      - server
